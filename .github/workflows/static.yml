name: Deploy portfolio to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f index.html
          test -f app.js
          test -f style.css
          test -d assets
          python3 - <<'PY'
          import re
          from pathlib import Path
          for ref in re.findall(r'(?:src|href)="([^"]+)"', Path('index.html').read_text()):
              if not ref.startswith(('#', 'mailto:', 'http:', 'https:')):
                  assert Path(ref).is_file(), f'Missing asset: {ref}'
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
